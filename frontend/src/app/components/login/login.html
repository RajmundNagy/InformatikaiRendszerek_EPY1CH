<div class="min-h-screen bg-gray-100 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 space-y-8">

        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                {{ isLoginMode ? 'Bejelentkezés' : 'Regisztráció' }}
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Autókölcsönző Rendszer
            </p>
        </div>

        <div *ngIf="errorMessage"
            [ngClass]="errorMessage.includes('Sikeres') ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
            class="p-3 rounded text-sm text-center font-medium">
            {{ errorMessage }}
        </div>

        <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
            <div class="rounded-md shadow-sm -space-y-px">
                <div>
                    <label for="email-address" class="sr-only">Email cím</label>
                    <input id="email-address" name="email" type="email" required [(ngModel)]="email"
                        class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                        placeholder="Email cím">
                </div>
                <div>
                    <label for="password" class="sr-only">Jelszó</label>
                    <input id="password" name="password" type="password" required [(ngModel)]="password"
                        class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm"
                        placeholder="Jelszó">
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    {{ isLoginMode ? 'Bejelentkezés' : 'Regisztráció' }}
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <button type="button" (click)="toggleMode()"
                class="text-sm text-blue-600 hover:text-blue-500 font-medium bg-transparent border-none cursor-pointer">
                {{ isLoginMode ? 'Nincs még fiókod? Regisztrálj!' : 'Már van fiókod? Jelentkezz be!' }}
            </button>
        </div>

    </div>
</div>
